name: 'atliq_commerce'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'atliq_commerce'

model-paths: ["models"]
#analysis-paths: ["analyses"]
#test-paths: ["tests"]
#seed-paths: ["seeds"]
#macro-paths: ["macros"]
#snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

models:
  atliq_commerce:
    +schema: gold
    gold:
      +schema: gold
      +enabled: true