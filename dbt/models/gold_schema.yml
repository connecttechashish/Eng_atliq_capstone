version: 2

models:
  - name: dim_customer
    description: "Customer dimension table"
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique

  - name: dim_product
    description: "Product dimension table"
    columns:
      - name: product_id
        tests:
          - not_null
          - unique

  - name: fact_orders
    description: "Fact table combining orders, order_items, and payments from the silver layer."

    columns:
      - name: order_id
        description: "Primary key for the order."
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_id

      - name: customer_id
        description: "Customer who placed the order."
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_id

      - name: order_date
        description: "Date when the order was placed."
        tests:
          - not_null

      - name: order_item_id
        description: "Primary key for the order item."
        tests:
          - not_null

      - name: product_id
        description: "Product purchased in the order."
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_id

      - name: quantity
        description: "Quantity of the product purchased."
        tests:
          - not_null

      - name: payment_id
        description: "Payment record associated with the order."
        tests:
          - not_null

      - name: amount
        description: "Payment amount for the order."
        tests:
          - not_null

      - name: line_total
        description: "Total price for the line item (quantity × unit price)."
        tests:
          - not_null
